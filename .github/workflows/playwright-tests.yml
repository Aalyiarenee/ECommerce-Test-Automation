name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore EcommerceTests/EcommerceTests.csproj

      - name: Build project
        run: dotnet build EcommerceTests/EcommerceTests.csproj --no-restore

      - name: Install Playwright browsers
        run: |
          pwsh EcommerceTests/bin/Debug/net10.0/playwright.ps1 install --with-deps

      - name: Run automated tests
        run: dotnet test EcommerceTests/EcommerceTests.csproj --no-build